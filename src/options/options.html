<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="opt_title">AI Tab Grouper</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <img src="../../icons/icon48.png" width="32" height="32" alt="">
      <h1>AI Tab Grouper</h1>
    </header>

    <div class="banner" id="managedBanner" hidden>
      <strong data-i18n="opt_managedTitle"></strong>
      <span class="muted" data-i18n="opt_managedBody"></span>
    </div>

    <form id="form">
      <div class="stack">
        <section>
          <h2 data-i18n="opt_claudeHeading"></h2>
          <div class="disclosure" id="disclosure">
            <strong data-i18n="opt_disclosureTitle"></strong>
            <p data-i18n="opt_disclosureBody"><strong id="dest" data-i18n-slot="dest"></strong></p>
            <p data-i18n="opt_disclosureUse"></p>
            <label class="check"><input type="checkbox" id="consent"> <span data-i18n="opt_consent"></span></label>
          </div>
          <label class="check"><input type="checkbox" name="enableClaude"> <span data-i18n="opt_enableClaude"></span></label>

          <p id="proxyInfo" class="ok" hidden data-i18n="opt_proxyInfo"></p>

          <div id="byok" class="stack">
            <div class="field">
              <label for="apiKey" data-i18n="opt_apiKeyLabel"></label>
              <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
              <small data-i18n="opt_apiKeyHelp"></small>
            </div>
            <label class="check"><input type="checkbox" id="rememberApiKey">
              <span data-i18n="opt_rememberKey"></span></label>
          </div>

          <div class="field">
            <label for="claudeModel" data-i18n="opt_modelLabel"></label>
            <input id="claudeModel" name="claudeModel" type="text" spellcheck="false">
            <small data-i18n="opt_modelHelp"></small>
          </div>
          <div class="inline">
            <button type="button" id="testClaude" data-i18n="opt_testConnection"></button>
            <button type="button" id="clearKey" class="ghost" data-i18n="opt_clearKey"></button>
            <span id="claudeResult" aria-live="polite"></span>
          </div>
        </section>

        <section>
          <h2 data-i18n="opt_desktopHeading"></h2>
          <p class="muted" data-i18n="opt_desktopIntro"></p>
          <label class="check"><input type="checkbox" name="enableDesktopBridge" id="enableDesktopBridge"> <span data-i18n="opt_enableBridge"></span></label>
          <div class="inline"><span><span data-i18n="opt_statusLabel"></span> <strong id="bridgeState">…</strong></span></div>
          <div class="field">
            <label for="extId" data-i18n="opt_extIdLabel"></label>
            <div class="inline"><input id="extId" type="text" readonly><button type="button" id="copyId" data-i18n="opt_copy"></button></div>
            <small data-i18n="opt_bridgeInstallHelp"></small>
          </div>
        </section>

        <section>
          <h2 data-i18n="opt_nanoHeading"></h2>
          <label class="check"><input type="checkbox" name="enableNano"> <span data-i18n="opt_enableNano"></span></label>
          <label class="check"><input type="checkbox" name="preferOnDevice"> <span data-i18n="opt_preferOnDevice"></span></label>
          <div class="inline">
            <span><span data-i18n="opt_statusLabel"></span> <strong id="nanoState">…</strong></span>
            <button type="button" id="downloadNano" hidden data-i18n="opt_downloadModel"></button>
          </div>
          <small class="muted" data-i18n="opt_nanoHelp"></small>
        </section>

        <section>
          <h2 data-i18n="opt_behaviorHeading"></h2>
          <label class="check"><input type="checkbox" name="autoGroup"> <span data-i18n="opt_autoGroup"></span></label>
          <label class="check"><input type="checkbox" name="enableHeuristic"> <span data-i18n="opt_enableHeuristic"></span></label>
          <label class="check"><input type="checkbox" name="catchAllGroup"> <span id="catchAllLabel"></span></label>
          <div class="grid2">
            <div class="field">
              <label for="language" data-i18n="opt_languageLabel"></label>
              <select id="language" name="language"><option value="auto" data-i18n="opt_languageAuto"></option><option value="en">English</option><option value="es">Español</option></select>
            </div>
            <div class="field">
              <label for="minGroupSize" data-i18n="opt_minGroupSize"></label>
              <input id="minGroupSize" name="minGroupSize" type="number" min="1" max="10">
            </div>
            <div class="field">
              <label for="minIntervalMs" data-i18n="opt_minInterval"></label>
              <input id="minIntervalMs" name="minIntervalMs" type="number" min="2" max="600" data-scale="1000">
            </div>
            <div class="field">
              <label for="maxTabsPerRequest" data-i18n="opt_maxTabs"></label>
              <input id="maxTabsPerRequest" name="maxTabsPerRequest" type="number" min="5" max="150">
            </div>
          </div>
        </section>

        <section>
          <h2 data-i18n="opt_privacyHeading"></h2>
          <label class="check"><input type="checkbox" name="sendPath"> <span data-i18n="opt_sendPath"></span></label>
          <div class="field">
            <label for="excludedHosts" data-i18n="opt_excludedHostsLabel"></label>
            <textarea id="excludedHosts" name="excludedHosts" data-i18n-placeholder="opt_excludedHostsPlaceholder"></textarea>
            <small id="policyHosts" data-i18n="opt_excludedHostsHelp"></small>
          </div>
        </section>
      </div>

      <div class="savebar">
        <button type="submit" class="primary" data-i18n="opt_save"></button>
        <span id="saved" aria-live="polite"></span>
      </div>
    </form>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
