<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AI Tab Grouper</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img src="../../icons/icon32.png" width="20" height="20" alt="">
      <h1>AI Tab Grouper</h1>
    </header>
    <section class="status" id="status" aria-live="polite"><p class="muted">Cargando…</p></section>
    <div class="actions">
      <button id="group" class="primary">Agrupar ahora</button>
      <div class="row">
        <button id="regroup" title="Reclasifica también las pestañas ya agrupadas">Reorganizar todo</button>
        <button id="ungroup" class="ghost">Desagrupar</button>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="auto"> Agrupar automáticamente al navegar</label>
    <footer>
      <a href="#" id="options">Configuración</a>
      <span class="muted"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>G</kbd></span>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
